# Builds and runs the tests (perft + bench signature) on every push to master and every PR
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # adds a 'Run workflow' button on the Actions tab

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # gcc and apple clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset release
      - run: cmake --build --preset release -j 4
      - run: ctest --preset release
