# Builds and runs the tests (perft + bench signature) on every push to master and every PR
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # adds a 'Run workflow' button on the Actions tab

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest] # gcc, apple clang and mingw gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # windows has to be told to use ninja & g++, or cmake picks visual studio
      - run: cmake --preset release ${{ runner.os == 'Windows' && '-G Ninja -DCMAKE_CXX_COMPILER=g++' || '' }}
      - run: cmake --build --preset release -j 4
      - run: ctest --preset release
